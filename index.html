<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Para Minha Mãe</title>
  <style>
    body {
      background-color: #ffe6e6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #a10000;
      text-align: center;
      padding: 1em;
      overflow-y: auto;
    }

    h1 {
      font-size: 1.8em;
      margin-bottom: 1.5em;
    }

    #frase {
      font-style: italic;
      font-size: 1.2em;
      background-color: #fff0f0;
      padding: 1em;
      margin: 0 auto 2em;
      border-radius: 10px;
      max-width: 500px;
      border: 1px solid #ffcccc;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.1);
      min-height: 70px;
    }

    button {
      /* Botão em formato de coração */
      background-color: #ff4d4d;
      color: white;
      border: none;
      padding: 0;
      cursor: pointer;
      font-size: 1em;
      margin-top: 2em;
      margin-bottom: 2em;
      text-indent: -9999px;
      overflow: visible;
      position: relative;
      width: 70px;
      height: 60px;
      transform: rotate(-45deg);
    }

    button::before,
    button::after {
      content: '';
      position: absolute;
      bottom: 15px;
      width: 70px;
      height: 70px;
      background-color: #ff4d4d;
      border-radius: 50%;
    }

    button::before {
      left: -35px;
    }

    button::after {
      left: 0;
    }

    button:hover {
      background-color: #e60000;
    }

    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: red;
      transform: rotate(45deg);
      animation: float 10s linear infinite;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: red;
      border-radius: 50%;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      left: -10px;
      top: 0;
    }

    @keyframes float {
      0% { transform: translateY(0) rotate(45deg); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(-120vh) rotate(45deg); opacity: 0; }
    }

    .legenda-foto {
      font-size: 0.9em;
      color: #770000;
      font-style: italic;
      margin-bottom: 2em;
    }

    .foto-mae {
      max-width: 80%;
      border-radius: 15px;
      margin-top: 1em;
      margin-bottom: 3em;
      box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.1);
      opacity: 1;
    }
  </style>
</head>
<body>
  <h1>Para minha mãe, cuja companhia é maior poesia que a vida tem a oferecer!</h1>

  <div id="frase">Clique no botão para ver uma frase!</div>
  <button onclick="mostrarFrase()">Mostrar Frase</button>

  <script>
    const frases = [
      "Tudo vale a pena quando a alma não é pequena. – Fernando Pessoa",
      "O que vale na vida não é o ponto de partida e sim a caminhada. – Cora Coralina",
      "A vida é feita de escolhas. – Ana Maria Braga",
      "A felicidade é a certeza de que a nossa vida não está se passando inutilmente. – Cora Coralina",
      "O amor é a única coisa que cresce à medida que se reparte. – Antoine de Saint-Exupéry",
      "A amizade é a base de todo o amor verdadeiro. – Rainer Maria Rilke",
      "O essencial é invisível aos olhos. – Antoine de Saint-Exupéry",
      "Cada um é responsável por sua própria felicidade. – Dalai Lama",
      "A felicidade não é algo pronto. Ela vem de suas próprias ações. – Dalai Lama",
      "A vida é uma jornada, não um destino. – Ralph Waldo Emerson",
      "O segredo da felicidade é a liberdade, e o segredo da liberdade é a coragem. – Tucídides",
      "Viver é a coisa mais rara do mundo. A maioria das pessoas existe, isso é tudo. – Oscar Wilde",
      "Somos do tamanho dos nossos sonhos. – Fernando Pessoa",
      "Você nunca sabe a força que tem, até que a sua única alternativa é ser forte. – Johnny Depp",
      "A vida é 10% o que acontece com você e 90% como você reage. – Charles R. Swindoll",
      "É preciso ter o caos dentro de si para gerar uma estrela dançante. – Friedrich Nietzsche",
      "O verdadeiro amor nunca se desgasta. Quanto mais se dá, mais se tem. – Antoine de Saint-Exupéry",
      "A vida é o que acontece quando você está ocupado fazendo outros planos. – John Lennon",
      "O melhor ainda está por vir. – Audrey Hepburn",
      "Não chore porque acabou, sorria porque aconteceu. – Dr. Seuss",
      "A gratidão é a memória do coração. – Jean-Baptiste Massieu",
      "O que a lagarta chama de fim do mundo, o mestre chama de borboleta. – Richard Bach",
      "Quando se ama, não é preciso entender o que se passa lá fora, pois tudo passa a acontecer dentro de nós. – Paulo Coelho",
      "O amor é a força mais poderosa do universo. – Mahatma Gandhi",
      "A maior de todas as vitórias é a vitória sobre si mesmo. – Platão",
      "O bom da vida é saber que cada dia é uma nova oportunidade. – William Shakespeare",
      "O amor é o que há de mais simples e complexo na vida. – Vinícius de Moraes",
      "O melhor caminho é sempre o que leva ao coração. – Ralph Waldo Emerson",
      "A vida é uma obra de arte. – Chuck Palahniuk",
      "A paz começa com um sorriso. – Madre Teresa",
      "Não tenha medo de ser você mesmo. – Ellen DeGeneres",
      "A felicidade não é algo pronto. Ela vem de suas próprias ações. – Dalai Lama",
      "Em cada ato de bondade, você semeia felicidade. – Martha Beck",
      "Acredite em você e tudo será possível. – Emily Dickinson",
      "A vida é feita de pequenos momentos. – Albert Einstein",
      "Você é a razão pela qual eu acredito em amor. – Anônimo",
      "A vida é uma única jornada, não uma corrida. – Anônimo",
      "Cada passo em frente é uma vitória. – Anônimo",
      "O que você faz hoje pode melhorar todos os seus amanhãs. – Ralph Marston",
      "O amor não é sobre o que você diz, mas sobre o que você faz. – Anônimo",
      "A felicidade é um perfume que você não pode derramar sobre os outros sem que caia algumas gotas sobre você. – Ralph Waldo Emerson",
      "É a nossa luz, não a nossa escuridão, que mais nos assusta. – Marianne Williamson",
      "O amor não é o que você vê, mas o que você sente. – Anônimo",
      "Cada momento é um novo começo. – T.S. Eliot",
      "Viva cada momento como se fosse o último. – Anônimo",
      "O que você semear, você colherá. – Buda",
      "O futuro pertence àqueles que acreditam na beleza dos seus sonhos. – Eleanor Roosevelt"
    ];

    function mostrarFrase() {
      const index = Math.floor(Math.random() * frases.length);
      document.getElementById("frase").innerText = frases[index];
    }
  </script>

  <div class="heart" style="left:10%; animation-delay: 0s;"></div>
  <div class="heart" style="left:25%; animation-delay: 2s;"></div>
  <div class="heart" style="left:40%; animation-delay: 4s;"></div>
  <div class="heart" style="left:60%; animation-delay: 1s;"></div>
  <div class="heart" style="left:75%; animation-delay: 3s;"></div>
  <div class="heart" style="left:90%; animation-delay: 5s;"></div>

  <p class="legenda-foto">Em cada sorriso, uma história; em cada abraço, um lar. Família, nosso maior presente.</p>
  <img src="Screenshot_20250503-163007~3.png" alt="Foto linda de minha mãe" class="foto-mae">

</body>
</html>
